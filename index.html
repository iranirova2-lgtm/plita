<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#f3f3f3;
  color:#111;
}

.wrap{
  max-width:520px;
  margin:auto;
  padding:20px;
}

.title{
  font-size:36px;
  font-weight:900;
  margin-bottom:5px;
  letter-spacing:-1px;
}

.subtitle{
  font-size:13px;
  color:#555;
  margin-bottom:15px;
}

.block{
  background:#fff;
  border:3px solid #111;
  padding:12px;
  margin-bottom:15px;
  overflow:hidden;
}

input,select,button{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border:2px solid #111;
  font-size:16px;
  box-sizing:border-box;
}

button{
  background:#d71920;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

.result{
  border:3px solid #111;
  padding:10px;
  margin-bottom:12px;
  background:#fff;
  overflow:hidden;
}

.best{
  border:5px solid #d71920;
}

.tag{
  font-size:12px;
  font-weight:bold;
  margin-bottom:5px;
}

.scheme{
  display:flex;
  width:100%;
  height:70px;
  margin-top:10px;
  overflow:hidden;
}

.slab{
  border-right:2px solid #111;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  line-height:1.15;
  text-align:center;
  overflow:hidden;
  word-break:break-word;
  padding:2px;
}

.monolith{
  background:#d71920;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  text-align:center;
  overflow:hidden;
  padding:2px;
}

.spec{
  margin-top:10px;
  font-size:13px;
  line-height:1.35;
}

.footer{
  margin-top:10px;
  font-size:11px;
  color:#555;
}
</style>
</head>

<body>

<div class="wrap">

<div class="title">ПЛИТА</div>
<div class="subtitle">Эскизная раскладка плит ПК</div>

<div class="block">
<input id="width" placeholder="Ширина, мм" value="6480">

<select id="length">
<option>3000</option>
<option>3600</option>
<option>4200</option>
<option>4800</option>
<option>5400</option>
<option selected>6000</option>
<option>6300</option>
<option>6600</option>
<option>7200</option>
</select>

<button onclick="calc()">Подобрать</button>
<button onclick="saveJPG()">Скачать JPG (лучший)</button>
</div>

<div id="output"></div>

</div>

<script>

const slabs=[
{w:1500,c:"15",p:1},
{w:1200,c:"12",p:1},
{w:1000,c:"10",p:2}
];

function mark(len,s){
return "ПК "+(len/100)+"."+s.c+"-8";
}

function calc(){

let W=parseInt(document.getElementById("width").value);
let L=parseInt(document.getElementById("length").value);

let variants=[];

for(let a=0;a<10;a++)
for(let b=0;b<10;b++)
for(let c=0;c<10;c++){

let sum=a*1500+b*1200+c*1000;
if(sum<=W && sum>0){

let mono=W-sum;
let count=a+b+c;
let types=[a,b,c].filter(x=>x>0).length;
let rarity=a*1 + b*1 + c*2;

variants.push({a,b,c,sum,mono,count,types,rarity});
}
}

variants.sort((x,y)=>
x.mono-y.mono ||
x.rarity-y.rarity ||
x.types-y.types ||
x.count-y.count
);

let best=variants[0];
let simple=[...variants].sort((a,b)=>a.types-b.types || a.mono-b.mono)[0];

render([best,simple],W,L);

}

function render(list,W,L){

let html='';
const names=["ЛУЧШИЙ","ПРОСТОЙ"];

list.forEach((v,i)=>{

html+=`<div class="result ${i==0?'best':''}" ${i==0?'id="export"':''}>`;

html+=`<div class="tag">${names[i]}</div>`;
html+=`Монолит: ${v.mono} мм<br>`;

html+='<div class="scheme">';

let add=(count,slab)=>{
for(let j=0;j<count;j++){
html+=`<div class="slab" style="width:${slab.w/W*100}%">
${mark(L,slab)}<br>${slab.w}
</div>`;
}
}

add(v.a,slabs[0]);
add(v.b,slabs[1]);
add(v.c,slabs[2]);

if(v.mono>0){
html+=`<div class="monolith" style="width:${v.mono/W*100}%">
${v.mono}
</div>`;
}

html+='</div>';

html+='<div class="spec">';
if(v.a) html+=mark(L,slabs[0])+' — '+v.a+' шт<br>';
if(v.b) html+=mark(L,slabs[1])+' — '+v.b+' шт<br>';
if(v.c) html+=mark(L,slabs[2])+' — '+v.c+' шт<br>';
html+='</div>';

html+='<div class="footer">Автор: Ирина Матвеева</div>';

html+='</div>';

});

document.getElementById("output").innerHTML=html;

}

function saveJPG(){
let el=document.getElementById("export");

html2canvas(el,{scale:2}).then(canvas=>{
let link=document.createElement("a");
link.download="plita.jpg";
link.href=canvas.toDataURL("image/jpeg",0.95);
link.click();
});
}

calc();

</script>

</body>
</html>
